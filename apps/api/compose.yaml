services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kwanzago
      POSTGRES_USER: kwanzago
      POSTGRES_PASSWORD: kwanzago_demo_local
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwanzago -d kwanzago"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kwanzago_pg_data:/var/lib/postgresql

volumes:
  kwanzago_pg_data:
